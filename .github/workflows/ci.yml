name: CI

on:
  pull_request:
  workflow_dispatch:
  # Advisories are published against dependencies that haven't changed, so
  # scan weekly even when nothing is being merged.
  schedule:
    - cron: "23 6 * * 1"

jobs:
  go:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: src/go.mod

      - name: Build
        run: go build ./...
        working-directory: src

      - name: Vet
        run: go vet ./...
        working-directory: src

      - name: Test
        run: go test ./...
        working-directory: src

      # Fails on a known vulnerability in a package the code actually calls.
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        working-directory: src

  # Lints the Dockerfile with hadolint. This used to build the image (both
  # platforms) to catch Dockerfile breakage; docker-publish.yml still builds it
  # on merge to main. The job is still called `docker` because the repo's
  # ruleset requires a check with that name.
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
