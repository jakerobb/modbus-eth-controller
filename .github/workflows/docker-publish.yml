name: Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod

      - name: Vet
        run: go vet ./...
        working-directory: src

      - name: Test
        run: go test ./...
        working-directory: src

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    # Pushes regenerated Swagger docs back to main.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger docs
        run: |
          cd src
          go run github.com/swaggo/swag/cmd/swag init -d cmd,pkg

      # Committed through the GraphQL API rather than `git push` so that
      # GitHub signs the commit (main requires signed commits). The ruleset
      # lets the Actions app bypass the pull request requirement only.
      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Contents go through files and --slurpfile: they're too big for argv.
          : > additions.jsonl
          deletions='[]'
          while IFS=$'\t' read -r status path; do
            if [ "$status" = D ]; then
              deletions=$(jq -c --arg p "$path" '. + [{path: $p}]' <<< "$deletions")
            else
              base64 < "$path" | tr -d '\n' | jq -Rs --arg p "$path" '{path: $p, contents: .}' >> additions.jsonl
            fi
          done < <(git diff --cached --name-status --no-renames)
          jq -s '.' additions.jsonl > additions.json

          jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$GITHUB_REF_NAME" \
            --arg oid "$(git rev-parse HEAD)" --argjson del "$deletions" \
            --slurpfile add additions.json '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: "chore: auto-update swagger docs"},
                expectedHeadOid: $oid,
                fileChanges: {additions: $add[0], deletions: $del}
              }}
            }' > request.json
          gh api graphql --input request.json
          rm additions.jsonl additions.json request.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get date tag
        id: date
        run: echo "tag=$(date -u +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            jakerobb/modbus-eth-controller:latest
            jakerobb/modbus-eth-controller:${{ steps.date.outputs.tag }}

      - name: Report remote image sizes by platform
        run: |
          curl -sSfL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz | tar xz
          ./crane manifest jakerobb/modbus-eth-controller:${{ steps.date.outputs.tag }} > manifest.json
          
          echo "### Remote image sizes by platform" >> $GITHUB_STEP_SUMMARY
          for digest in $(jq -r '.manifests[].digest' manifest.json); do
            arch=$(jq -r --arg d "$digest" '.manifests[] | select(.digest == $d) | .platform.architecture // empty' manifest.json)
            os=$(jq -r --arg d "$digest" '.manifests[] | select(.digest == $d) | .platform.os // empty' manifest.json)
          
            # Skip manifests with no known platform (e.g., manifest lists)
            if [ -z "$arch" ] || [ -z "$os" ]; then
              continue
            fi
          
            ./crane manifest jakerobb/modbus-eth-controller@$digest > arch-manifest.json
            total=$(jq '[.layers[].size] | add' arch-manifest.json)
            human=$(numfmt --to=iec --suffix=B "$total")
            echo "- $arch: \`$human\`" >> $GITHUB_STEP_SUMMARY
          done
